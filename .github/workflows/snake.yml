name: Generate Snake & Sync Real Stats (Cyberdeck)

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - assets/snake.svg
      - assets/stats.svg
      - assets/radar.svg
      - assets/projects.svg

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate cyberdeck snake (cyan snake · magenta dots)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: NitaxIso
          outputs: |
            assets/snake.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#3a1230,#7d1f63,#c23a9b,#ff5cf2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Strip stray progress bar artifact & ensure WCAG A11y invariants
        run: |
          sed -i 's/\.u{/\.u{display:none;/' assets/snake.svg
          sed -i 's/viewBox="-16 -32 880 192"/viewBox="-16 -32 880 160"/' assets/snake.svg
          sed -i 's/<svg /<svg role="img" aria-label="Contribution Snake" /' assets/snake.svg
          sed -i 's/<desc>/<title>Contribution Snake<\/title><desc>/' assets/snake.svg

      - name: Sync real GitHub contributions & streak into SVG cards
        shell: python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import datetime
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          USER = "NitaxIso"
          TOKEN = os.environ.get("GITHUB_TOKEN", "")
          HEADERS = {"User-Agent": "NitaxIso-Cyberdeck-Sync"}
          if TOKEN:
              HEADERS["Authorization"] = f"Bearer {TOKEN}"

          def fetch_text(url: str, extra_headers=None) -> str:
              hdrs = dict(HEADERS)
              if extra_headers:
                  hdrs.update(extra_headers)
              req = urllib.request.Request(url, headers=hdrs)
              with urllib.request.urlopen(req, timeout=15) as resp:
                  return resp.read().decode("utf-8")

          user_data = json.loads(fetch_text(f"https://api.github.com/users/{USER}"))
          repos_data = json.loads(fetch_text(f"https://api.github.com/users/{USER}/repos?per_page=100"))
          pub_repos = int(user_data.get("public_repos", len(repos_data)))
          total_stars = sum(int(r.get("stargazers_count", 0)) for r in repos_data)

          contrib_html = fetch_text(
              f"https://github.com/users/{USER}/contributions",
              {"User-Agent": "Mozilla/5.0"},
          )
          m_total = re.search(r"([\d,]+)\s+contributions", contrib_html)
          total_contribs = int(m_total.group(1).replace(",", "")) if m_total else 57

          day_matches = re.findall(r'data-date="(\d{4}-\d{2}-\d{2})"[^>]*data-level="(\d)"', contrib_html)
          active_dates = sorted(
              datetime.date.fromisoformat(d) for d, lvl in day_matches if int(lvl) > 0
          )
          active_days_count = len(active_dates)

          longest_streak = 0
          cur_run = 0
          prev_d = None
          for d in active_dates:
              if prev_d and (d - prev_d).days == 1:
                  cur_run += 1
              else:
                  cur_run = 1
              if cur_run > longest_streak:
                  longest_streak = cur_run
              prev_d = d

          current_streak = 0
          if active_dates:
              today = datetime.date.today()
              if (today - active_dates[-1]).days <= 1:
                  current_streak = 1
                  for i in range(len(active_dates) - 1, 0, -1):
                      if (active_dates[i] - active_dates[i - 1]).days == 1:
                          current_streak += 1
                      else:
                          break

          stats_path = Path("assets/stats.svg")
          if stats_path.exists():
              s_txt = stats_path.read_text(encoding="utf-8")
              s_txt = re.sub(
                  r'(<text class="m5val" x="165" y="148"[^>]*>)\d+(</text>)',
                  rf'\g<1>{total_contribs}\g<2>',
                  s_txt,
              )
              s_txt = re.sub(
                  r'\d+ public repos · \d+ active days',
                  f'{pub_repos} public repos · {active_days_count} active days',
                  s_txt,
              )
              s_txt = re.sub(
                  r'(<text class="m5val" x="450" y="151"[^>]*>)\d+(</text>)',
                  rf'\g<1>{current_streak}\g<2>',
                  s_txt,
              )
              s_txt = re.sub(
                  r'(<text class="m5val" x="735" y="148"[^>]*>)\d+(</text>)',
                  rf'\g<1>{longest_streak}\g<2>',
                  s_txt,
              )
              stats_path.write_text(s_txt, encoding="utf-8")

          radar_path = Path("assets/radar.svg")
          if radar_path.exists():
              r_txt = radar_path.read_text(encoding="utf-8")
              r_txt = re.sub(
                  r'(<text class="m4val" x="566" y="100"[^>]*>)\d+(</text>)',
                  rf'\g<1>{pub_repos:02d}\g<2>',
                  r_txt,
              )
              r_txt = re.sub(
                  r'(<text class="m4val" x="566" y="120"[^>]*>)\d+(</text>)',
                  rf'\g<1>{total_contribs:02d}\g<2>',
                  r_txt,
              )
              r_txt = re.sub(
                  r'(<text class="m4val" x="566" y="140"[^>]*>)\d+(</text>)',
                  rf'\g<1>{active_days_count:02d}\g<2>',
                  r_txt,
              )
              radar_path.write_text(r_txt, encoding="utf-8")

          proj_path = Path("assets/projects.svg")
          if proj_path.exists():
              p_txt = proj_path.read_text(encoding="utf-8")
              p_txt = re.sub(
                  r'# \d+ public repos · ★\d+ total',
                  f'# {pub_repos} public repos · ★{total_stars} total',
                  p_txt,
              )
              proj_path.write_text(p_txt, encoding="utf-8")

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution snake & profile telemetry"
          file_pattern: "assets/snake.svg assets/stats.svg assets/radar.svg assets/projects.svg"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
