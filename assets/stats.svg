<svg viewBox="6.1 0 887.8 250" width="900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MOD-05 GIT LOG — 66 Total Contributions, Current Streak 2 days, Longest Streak 5 days" font-family="'Courier New',Consolas,ui-monospace,monospace">
  <title>MOD-05 // GIT LOG — GitHub Contributions &amp; Streak Summary</title>
  <defs>
    <linearGradient id="m5panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d111a"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <linearGradient id="m5ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7b00"/>
      <stop offset="0.5" stop-color="#ff5cf2"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="m5glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m5glowM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5cf2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff5cf2" stop-opacity="0"/>
    </radialGradient>
    <filter id="m5soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="m5bloom" x="-60%" y="-80%" width="220%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="m5blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="m5scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <clipPath id="m5clip"><rect x="14" y="14" width="872" height="222" rx="12"/></clipPath>
    <style>
      @keyframes m5pulse{0%,100%{opacity:1}50%{opacity:.35}}
      @keyframes m5ping{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(2.8);opacity:0}}
      @keyframes m5beam{0%{transform:translateX(-200px)}100%{transform:translateX(900px)}}
      @keyframes m5caret{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes m5eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
      @keyframes m5val{0%,100%{opacity:1}50%{opacity:.78}}
      @keyframes m5breathe{0%,100%{opacity:.72}50%{opacity:.4}}
      @keyframes m5orb{0%,100%{opacity:.5}50%{opacity:.72}}
      @keyframes m5flame{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
      .m5led{animation:m5pulse 2.2s ease-in-out infinite;transform-origin:center}
      .m5ping{animation:m5ping 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
      .m5beam{animation:m5beam 7s linear infinite}
      .m5caret{animation:m5caret 1.05s steps(1) infinite}
      .m5eqbar{animation:m5eq 1.15s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
      .m5val{animation:m5val 2.6s ease-in-out infinite}
      .m5breathe{animation:m5breathe 4s ease-in-out infinite}
      .m5orb{animation:m5orb 6s ease-in-out infinite}
      .m5flame{animation:m5flame 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @media (prefers-reduced-motion:reduce){
        .m5led,.m5ping,.m5beam,.m5caret,.m5eqbar,.m5val,.m5breathe,.m5orb,.m5flame{animation:none}
      }
    </style>
  </defs>

  <!-- panel -->
  <rect x="14" y="14" width="872" height="222" rx="12" fill="url(#m5panel)" stroke="#222b3d" stroke-width="1.2"/>
  <rect x="15.5" y="15.5" width="869" height="219" rx="11" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.16"/>

  <g clip-path="url(#m5clip)">
    <circle class="m5orb" cx="120" cy="60" r="150" fill="url(#m5glowC)" filter="url(#m5blur)" opacity="0.5"/>
    <circle class="m5orb" cx="800" cy="220" r="160" fill="url(#m5glowM)" filter="url(#m5blur)" opacity="0.45" style="animation-delay:-3s"/>
    <rect x="14" y="14" width="872" height="222" fill="url(#m5scan)"/>
    <g class="m5beam"><rect x="14" y="14" width="150" height="222" fill="url(#m5glowC)" opacity="0.05"/></g>
  </g>

  <!-- corner reticles -->
  <g class="m5breathe" stroke="#22d3ee" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M26 40 L26 26 L40 26"/>
    <path d="M860 26 L874 26 L874 40"/>
    <path d="M26 210 L26 224 L40 224"/>
    <path d="M860 224 L874 224 L874 210"/>
  </g>

  <!-- header -->
  <g>
    <circle class="m5ping" cx="42" cy="42" r="4.5" fill="none" stroke="#27c93f" stroke-width="1.4"/>
    <circle class="m5led" cx="42" cy="42" r="4.5" fill="#27c93f" filter="url(#m5soft)"/>
    <circle cx="42" cy="42" r="4.5" fill="none" stroke="#27c93f" stroke-width="1" opacity="0.4"/>
    <text x="58" y="46" fill="#22d3ee" font-size="12.5" letter-spacing="2.5" font-weight="bold" filter="url(#m5bloom)">MOD-05 // CONTRIBUTIONS SUMMARY</text>
    <g fill="#22d3ee">
      <rect class="m5eqbar" x="792" y="35" width="3" height="13"/>
      <rect class="m5eqbar" x="797" y="35" width="3" height="13" style="animation-delay:-.35s"/>
      <rect class="m5eqbar" x="802" y="35" width="3" height="13" style="animation-delay:-.7s"/>
      <rect class="m5eqbar" x="807" y="35" width="3" height="13" style="animation-delay:-.9s"/>
    </g>
    <text x="862" y="46" fill="#7d8590" font-size="10.5" text-anchor="end" letter-spacing="1.5">~/stats</text>
  </g>
  <line x1="26" y1="56" x2="874" y2="56" stroke="#1b2230" stroke-width="1"/>

  <!-- prompt -->
  <g font-size="12.5">
    <text x="40" y="80"><tspan fill="#27c93f">NitaxIso@sec</tspan><tspan fill="#9aa6b8">:</tspan><tspan fill="#22d3ee">~$</tspan><tspan fill="#e6edf3"> git log --contributions --streak</tspan></text>
    <rect class="m5caret" x="394" y="71" width="7" height="11" fill="#22d3ee"/>
  </g>

  <!-- Vertical dividers between 3 columns -->
  <line x1="305" y1="100" x2="305" y2="218" stroke="#1b2230" stroke-width="1.2"/>
  <line x1="595" y1="100" x2="595" y2="218" stroke="#1b2230" stroke-width="1.2"/>

  <!-- COLUMN 1: Total Contributions -->
  <g text-anchor="middle">
    <text class="m5val" x="165" y="148" fill="#e6edf3" font-size="34" font-weight="bold" filter="url(#m5bloom)">67</text>
    <text x="165" y="176" fill="#22d3ee" font-size="12" font-weight="bold" letter-spacing="0.5">Total Contributions</text>
    <text x="165" y="196" fill="#7d8590" font-size="10">Mar 2026 – Present</text>
    <text x="165" y="213" fill="#566072" font-size="9.5">6 public repos · 22 active days</text>
  </g>

  <!-- COLUMN 2: Current Streak (Circular Ring + Flame) -->
  <g text-anchor="middle">
    <!-- Outer track circle -->
    <circle cx="450" cy="142" r="36" fill="none" stroke="#1f2937" stroke-width="5"/>
    <!-- Active neon ring -->
    <circle cx="450" cy="142" r="36" fill="none" stroke="url(#m5ring)" stroke-width="5" stroke-dasharray="190 40" stroke-linecap="round" transform="rotate(-70 450 142)" filter="url(#m5soft)"/>
    <!-- Flame icon at top of ring -->
    <g class="m5flame" transform="translate(450,104)">
      <circle cx="0" cy="0" r="9" fill="#0b0f17"/>
      <path d="M0 -7 C3 -3 5 0 5 3 C5 6 2.8 8 0 8 C-2.8 8 -5 6 -5 3 C-5 0 -3 -3 0 -7 Z" fill="#ff7b00"/>
      <path d="M0 -2 C1.5 0 2.5 2 2.5 3.8 C2.5 5.5 1.4 6.5 0 6.5 C-1.4 6.5 -2.5 5.5 -2.5 3.8 C-2.5 2 -1.5 0 0 -2 Z" fill="#ffd43b"/>
    </g>
    <!-- Streak number -->
    <text class="m5val" x="450" y="151" fill="#e6edf3" font-size="26" font-weight="bold" filter="url(#m5bloom)">2</text>
    <text x="450" y="196" fill="#ff9900" font-size="12" font-weight="bold" letter-spacing="0.5">Current Streak</text>
    <text x="450" y="213" fill="#7d8590" font-size="10">Active Today</text>
  </g>

  <!-- COLUMN 3: Longest Streak -->
  <g text-anchor="middle">
    <text class="m5val" x="735" y="148" fill="#e6edf3" font-size="34" font-weight="bold" filter="url(#m5bloom)">5</text>
    <text x="735" y="176" fill="#ff5cf2" font-size="12" font-weight="bold" letter-spacing="0.5">Longest Streak</text>
    <text x="735" y="196" fill="#7d8590" font-size="10">May 31 – Jun 4, 2026</text>
    <text x="735" y="213" fill="#566072" font-size="9.5">Consecutive Commit Days</text>
  </g>
</svg>
