<svg role="img" aria-label="MOD-02 FEATURED — 3 Bento Cards: drone-malware-analyst, aws-worklog-fcaj, 30-Days-Of-Python" viewBox="6.1 0 887.8 330" width="900" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New',Consolas,ui-monospace,monospace">
