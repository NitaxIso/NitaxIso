  <style>
    @keyframes m2pulse{0%,100%{opacity:1}50%{opacity:0.35}}
    @keyframes m2ping{0%{transform:scale(1);opacity:.5}70%,100%{transform:scale(2.8);opacity:0}}
    @keyframes m2beam{0%{transform:translateX(-260px)}100%{transform:translateX(900px)}}
    @keyframes m2caret{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes m2flick{0%,96%,100%{opacity:0}97%{opacity:0.5}98%{opacity:0}}
    @keyframes m2eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
    @keyframes m2tw{0%,100%{opacity:1}50%{opacity:.35}}
    @keyframes m2sheen{0%{transform:translateX(0)}55%,100%{transform:translateX(1060px)}}
    @keyframes m2breathe{0%,100%{opacity:.7}50%{opacity:.4}}
    .m2led{animation:m2pulse 2.4s ease-in-out infinite;transform-origin:center}
    .m2ping{animation:m2ping 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
    .m2beam{animation:m2beam 6s linear infinite}
    .m2caret{animation:m2caret 1s step-end infinite}
    .m2glitch{animation:m2flick 5s linear infinite}
    .m2eqbar{animation:m2eq 1.15s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
    .m2tw{animation:m2tw 2.6s ease-in-out infinite}
    .m2sheen{animation:m2sheen 7s ease-in-out infinite}
    .m2breathe{animation:m2breathe 4s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.m2led,.m2ping,.m2beam,.m2caret,.m2glitch,.m2eqbar,.m2tw,.m2sheen,.m2breathe{animation:none}}
