<svg role="img" aria-label="MOD-03 TOOLKIT — cybersecurity stack and toolset with icons" viewBox="6.1 0 887.8 260" width="900" xmlns="http://www.w3.org/2000/svg" font-family="&quot;Courier New&quot;,Consolas,ui-monospace,monospace">
  <title>MOD-03 // TOOLKIT — technical stack</title>
  <defs>
    <linearGradient id="m3-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d111a"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <radialGradient id="m3-glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m3-glowM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5cf2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff5cf2" stop-opacity="0"/>
    </radialGradient>
    <filter id="m3-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="m3-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <pattern id="m3-scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <clipPath id="m3-clip"><rect x="14" y="14" width="872" height="232" rx="12"/></clipPath>
    <linearGradient id="m3-sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes m3pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes m3ping{0%{transform:scale(1);opacity:.5}70%,100%{transform:scale(2.8);opacity:0}}
      @keyframes m3beam{0%{transform:translateX(-220px)}100%{transform:translateX(900px)}}
      @keyframes m3caret{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes m3eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
      @keyframes m3sheen{0%{transform:translateX(0)}55%,100%{transform:translateX(1040px)}}
      @keyframes m3breathe{0%,100%{opacity:.7}50%{opacity:.4}}
      .m3led{animation:m3pulse 2.4s ease-in-out infinite;transform-origin:center}
      .m3ping{animation:m3ping 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
      .m3beam{animation:m3beam 7s linear infinite}
      .m3caret{animation:m3caret 1.05s steps(1) infinite}
      .m3eqbar{animation:m3eq 1.15s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
      .m3sheen{animation:m3sheen 7.5s ease-in-out infinite}
      .m3breathe{animation:m3breathe 4s ease-in-out infinite}
      @media (prefers-reduced-motion:reduce){.m3led,.m3ping,.m3beam,.m3caret,.m3eqbar,.m3sheen,.m3breathe{animation:none}}
    </style>
  </defs>

  <!-- panel -->
  <rect x="14" y="14" width="872" height="232" rx="12" fill="url(#m3-panel)" stroke="#222b3d" stroke-width="1.2"/>
  <rect x="15.5" y="15.5" width="869" height="229" rx="11" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.16"/>

  <g clip-path="url(#m3-clip)">
    <circle cx="120" cy="60" r="140" fill="url(#m3-glowC)" filter="url(#m3-blur)" opacity="0.5"/>
    <circle cx="800" cy="230" r="150" fill="url(#m3-glowM)" filter="url(#m3-blur)" opacity="0.45"/>
    <rect x="14" y="14" width="872" height="232" fill="url(#m3-scan)"/>
    <g class="m3beam"><rect x="0" y="14" width="160" height="232" fill="url(#m3-glowC)" opacity="0.06"/></g>
    <g stroke="#283246" stroke-width="1" opacity="0.5">
      <line x1="26" y1="62" x2="26" y2="238"/>
    </g>
    <g fill="#566072" font-size="6" opacity="0.5" letter-spacing="1">
      <text x="20" y="90" transform="rotate(90 20 90)">01001100 01010011 00100000 01010011 01001111 01000011</text>
    </g>
  </g>

  <!-- corner reticles -->
  <g class="m3breathe" stroke="#22d3ee" stroke-width="1.4" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M26 40 L26 26 L40 26"/>
    <path d="M860 26 L874 26 L874 40"/>
    <path d="M26 220 L26 234 L40 234"/>
    <path d="M860 234 L874 234 L874 220"/>
  </g>

  <!-- header -->
  <g>
    <circle class="m3ping" cx="42" cy="42" r="4.5" fill="none" stroke="#27c93f" stroke-width="1.4"/>
    <circle cx="42" cy="42" r="4.5" fill="#27c93f" class="m3led"/>
    <circle cx="42" cy="42" r="4.5" fill="none" stroke="#27c93f" stroke-width="1" opacity="0.4"/>
    <text x="58" y="46" fill="#22d3ee" font-size="12.5" letter-spacing="2.5" filter="url(#m3-soft)">MOD-03 // TOOLKIT</text>
    <g transform="translate(792,38)">
      <rect class="m3eqbar" x="0" y="-4" width="3" height="10" fill="#22d3ee" opacity="0.5"/>
      <rect class="m3eqbar" x="5" y="-4" width="3" height="10" fill="#22d3ee" opacity="0.65" style="animation-delay:-.3s"/>
      <rect class="m3eqbar" x="10" y="-4" width="3" height="10" fill="#22d3ee" opacity="0.8" style="animation-delay:-.6s"/>
      <rect class="m3eqbar" x="15" y="-4" width="3" height="10" fill="#22d3ee" opacity="0.95" style="animation-delay:-.85s"/>
    </g>
    <text x="780" y="46" fill="#7d8590" font-size="10.5" text-anchor="end" letter-spacing="1.5">~/stack</text>
  </g>
  <line x1="26" y1="56" x2="874" y2="56" stroke="#1b2230" stroke-width="1"/>

  <!-- prompt -->
  <g font-size="12" letter-spacing="0.4">
    <text x="40" y="80" fill="#27c93f">NitaxIso@sec</text>
    <text x="133" y="80" fill="#9aa6b8">:</text>
    <text x="140" y="80" fill="#22d3ee">~</text>
    <text x="148" y="80" fill="#9aa6b8">$</text>
    <text x="160" y="80" fill="#e6edf3">cat stack.yaml</text>
    <rect x="262" y="71" width="7" height="11" fill="#22d3ee" class="m3caret"/>
  </g>

  <!-- ASCII shield sigil (right, faint cyan) -->
  <g fill="#22d3ee" opacity="0.13" font-size="9.5" letter-spacing="0.5" xml:space="preserve">
    <text x="788" y="118"> _______ </text>
    <text x="788" y="130">/ ===== \</text>
    <text x="788" y="142">|  [#]  |</text>
    <text x="788" y="154">| ATT&amp;CK |</text>
    <text x="788" y="166"> \ === / </text>
    <text x="788" y="178">  \ = /  </text>
    <text x="788" y="190">   \_/   </text>
  </g>

  <!-- groups with color-coded mini-icons inside pills -->
  <g font-size="11">
    <!-- languages -->
    <text x="40" y="112" fill="#22d3ee" letter-spacing="1" text-anchor="end" transform="translate(150,0)">languages:</text>
    <g transform="translate(205,99)" font-size="10.5">
      <g>
        <rect x="0" y="0" width="80" height="20" rx="6" fill="#3572A5" opacity="0.18" stroke="#3572A5" stroke-opacity="0.55"/>
        <circle cx="13" cy="10" r="3.5" fill="#ffd43b"/>
        <text x="46" y="14" fill="#e6edf3" text-anchor="middle">Python</text>
      </g>
      <g transform="translate(88,0)">
        <rect width="68" height="20" rx="6" fill="#22d3ee" opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4"/>
        <text x="14" y="14" fill="#27c93f" font-weight="bold">$_</text>
        <text x="44" y="14" fill="#e6edf3" text-anchor="middle">Bash</text>
      </g>
      <g transform="translate(164,0)">
        <rect width="108" height="20" rx="6" fill="#012456" opacity="0.55" stroke="#5391fe" stroke-opacity="0.55"/>
        <text x="14" y="14" fill="#5391fe" font-weight="bold">&gt;_</text>
        <text x="62" y="14" fill="#e6edf3" text-anchor="middle">PowerShell</text>
      </g>
      <g transform="translate(280,0)">
        <rect width="52" height="20" rx="6" fill="#555555" opacity="0.3" stroke="#a8b9cc" stroke-opacity="0.55"/>
        <circle cx="13" cy="10" r="3.5" fill="#a8b9cc"/>
        <text x="33" y="14" fill="#e6edf3" text-anchor="middle">C</text>
      </g>
    </g>

    <!-- detection -->
    <text x="40" y="140" fill="#ff5cf2" letter-spacing="1" text-anchor="end" transform="translate(150,0)">detection:</text>
    <g transform="translate(205,127)" font-size="10.5">
      <g>
        <rect width="64" height="20" rx="6" fill="#ff5cf2" opacity="0.12" stroke="#ff5cf2" stroke-opacity="0.42"/>
        <circle cx="13" cy="10" r="3.2" fill="#ff5cf2"/>
        <text x="38" y="14" fill="#e6edf3" text-anchor="middle">YARA</text>
      </g>
      <g transform="translate(72,0)">
        <rect width="68" height="20" rx="6" fill="#ff5cf2" opacity="0.12" stroke="#ff5cf2" stroke-opacity="0.42"/>
        <circle cx="13" cy="10" r="3.2" fill="#ffbd2e"/>
        <text x="40" y="14" fill="#e6edf3" text-anchor="middle">Snort</text>
      </g>
      <g transform="translate(148,0)">
        <rect width="128" height="20" rx="6" fill="#ff5cf2" opacity="0.12" stroke="#ff5cf2" stroke-opacity="0.42"/>
        <circle cx="14" cy="10" r="3.2" fill="#22d3ee"/>
        <text x="70" y="14" fill="#e6edf3" text-anchor="middle">MITRE ATT&amp;CK</text>
      </g>
    </g>

    <!-- siem -->
    <text x="40" y="168" fill="#22d3ee" letter-spacing="1" text-anchor="end" transform="translate(150,0)">siem:</text>
    <g transform="translate(205,155)" font-size="10.5">
      <g>
        <rect width="74" height="20" rx="6" fill="#22d3ee" opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4"/>
        <circle cx="13" cy="10" r="3.2" fill="#27c93f"/>
        <text x="43" y="14" fill="#e6edf3" text-anchor="middle">Splunk</text>
      </g>
      <g transform="translate(82,0)">
        <rect width="122" height="20" rx="6" fill="#22d3ee" opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4"/>
        <circle cx="14" cy="10" r="3.2" fill="#22d3ee"/>
        <text x="67" y="14" fill="#e6edf3" text-anchor="middle">Elastic / ELK</text>
      </g>
    </g>

    <!-- dfir -->
    <text x="40" y="196" fill="#ff5cf2" letter-spacing="1" text-anchor="end" transform="translate(150,0)">dfir:</text>
    <g transform="translate(205,183)" font-size="10.5">
      <g>
        <rect width="94" height="20" rx="6" fill="#ff5cf2" opacity="0.12" stroke="#ff5cf2" stroke-opacity="0.38"/>
        <circle cx="14" cy="10" r="3.2" fill="#22d3ee"/>
        <text x="53" y="14" fill="#e6edf3" text-anchor="middle">Wireshark</text>
      </g>
      <g transform="translate(102,0)">
        <rect width="98" height="20" rx="6" fill="#ff5cf2" opacity="0.12" stroke="#ff5cf2" stroke-opacity="0.38"/>
        <circle cx="14" cy="10" r="3.2" fill="#ff5cf2"/>
        <text x="55" y="14" fill="#e6edf3" text-anchor="middle">Volatility</text>
      </g>
    </g>

    <!-- platforms -->
    <text x="40" y="224" fill="#27c93f" letter-spacing="1" text-anchor="end" transform="translate(150,0)">platforms:</text>
    <g transform="translate(205,211)" font-size="10.5">
      <g>
        <rect width="66" height="20" rx="6" fill="#27c93f" opacity="0.12" stroke="#27c93f" stroke-opacity="0.38"/>
        <circle cx="13" cy="10" r="3.2" fill="#ffbd2e"/>
        <text x="39" y="14" fill="#e6edf3" text-anchor="middle">Linux</text>
      </g>
      <g transform="translate(74,0)">
        <rect width="80" height="20" rx="6" fill="#27c93f" opacity="0.12" stroke="#27c93f" stroke-opacity="0.38"/>
        <circle cx="13" cy="10" r="3.2" fill="#00a4ef"/>
        <text x="46" y="14" fill="#e6edf3" text-anchor="middle">Windows</text>
      </g>
      <g transform="translate(162,0)">
        <rect width="74" height="20" rx="6" fill="#27c93f" opacity="0.12" stroke="#27c93f" stroke-opacity="0.38"/>
        <circle cx="13" cy="10" r="3.2" fill="#2496ed"/>
        <text x="43" y="14" fill="#e6edf3" text-anchor="middle">Docker</text>
      </g>
      <g transform="translate(244,0)">
        <rect width="54" height="20" rx="6" fill="#27c93f" opacity="0.12" stroke="#27c93f" stroke-opacity="0.38"/>
        <circle cx="13" cy="10" r="3.2" fill="#f05032"/>
        <text x="33" y="14" fill="#e6edf3" text-anchor="middle">Git</text>
      </g>
      <g transform="translate(306,0)">
        <rect width="62" height="20" rx="6" fill="#ff9900" opacity="0.14" stroke="#ff9900" stroke-opacity="0.45"/>
        <circle cx="13" cy="10" r="3.2" fill="#ff9900"/>
        <text x="37" y="14" fill="#e6edf3" text-anchor="middle">AWS</text>
      </g>
    </g>
  </g>

  <!-- light sweep across the console -->
  <g clip-path="url(#m3-clip)"><g class="m3sheen"><rect x="-170" y="14" width="150" height="232" fill="url(#m3-sheenGrad)"/></g></g>
</svg>
